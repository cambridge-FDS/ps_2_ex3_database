[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ps2-nba"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "PS2 NBA database exercise"
dependencies = ["click>=8,<9"]

[tool.setuptools.packages.find]
include = ["nba", "queries"]

[tool.setuptools.package-data]
queries = ["*.sql"]
